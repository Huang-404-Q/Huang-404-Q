# 生成统计卡片，提交到 main 分支的 profile-summary-card-output/ 目录
#
# token：优先用仓库 secret SUMMARY_GITHUB_TOKEN（需要一个带 read:user 权限的 PAT），
# 没配时退回 GitHub 内置 token。内置 token 权限不够时任务会失败，配好 secret 再启用定时。
name: generate summary cards

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          UTC_OFFSET: 8
          THEME: default
